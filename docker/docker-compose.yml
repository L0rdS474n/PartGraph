# Docker Compose definition for the local PartGraph Dgraph instance.
#
# Security posture: every port is bound to 127.0.0.1 (loopback) only. Dgraph
# standalone ships without authentication, so the loopback binding is the
# access control. Do NOT bind these ports to all interfaces or expose them
# publicly.
#
# Image pinning: the image is pinned to a specific tag (v25.3.4) rather than a
# content digest. For a single-developer local tool this is an accepted risk:
# the tag is immutable in practice for a released version, and a digest pin
# would make routine upstream patch upgrades unnecessarily painful. Production
# deployments should pin to a digest.

services:
  dgraph:
    image: dgraph/standalone:v25.3.4
    # Explicit container name so integration tests can filter by name and never
    # match a foreign container (e.g. a cve-graph stack on the same machine).
    container_name: partgraph-dgraph
    restart: unless-stopped
    # Run a real init process (podman-init / tini) as PID 1. Do NOT remove this
    # as noise — without it, `db down` cannot shut Dgraph down gracefully at
    # all, no matter how large stop_grace_period is.
    #
    # Why: this image declares no ENTRYPOINT and no STOPSIGNAL; its CMD is
    # /run.sh, which reads, verbatim, including upstream's own comment:
    #
    #     # TODO properly handle SIGTERM for all three processes.
    #     dgraph zero &
    #     dgraph alpha
    #
    # PID 1 is therefore bash, with `dgraph alpha` as its FOREGROUND command,
    # and bash defers acting on a received signal until that foreground command
    # exits. SIGTERM sent to PID 1 is never forwarded to `dgraph alpha` —
    # regardless of uptime, load, or grace period. Measured on this host:
    # without init, `podman stop -t 60` took 60.2s and ended in SIGKILL (exit
    # 137) on a container barely a minute old with essentially nothing to
    # flush; with init, the same stop took 0.2s and exited 143 (a genuine
    # SIGTERM exit). A unit test pins this flag together with
    # stop_grace_period, because either one alone is not the fix (ADR-0021).
    init: true
    # Shutdown ceiling, meaningful only once init: true lets the signal
    # actually arrive. It is a rarely-reached upper bound, not a delay paid on
    # every stop: a healthy Dgraph now exits in a fraction of a second, and
    # this budget only matters when there is genuinely a lot to flush. This
    # value MUST equal partgraph.util.lifecycle.STOP_GRACE_SECONDS, the same
    # budget PartGraph's own engine `stop` sweep passes as `-t`; a unit test
    # imports that constant and fails if the two ever drift apart. 60 is a
    # judgement call, not a measured requirement — the busy case has never
    # been measured (ADR-0021).
    stop_grace_period: 60s
    ports:
      # host_ip:host_port:container_port — host ports are offset by +1 because
      # 8080/9080 are reserved by other local stacks on this machine.
      - "127.0.0.1:8081:8080"   # Alpha HTTP / health
      - "127.0.0.1:9081:9080"   # Alpha gRPC (pydgraph)
      - "127.0.0.1:8001:8000"   # Ratel / admin UI
    volumes:
      # Named volume keeps all Dgraph state across `db down` and restarts.
      - "partgraph_dgraph_data:/dgraph"

volumes:
  partgraph_dgraph_data:
    # Explicit name so the volume is not prefixed with the compose project name;
    # integration tests assert the volume name ends with partgraph_dgraph_data.
    name: partgraph_dgraph_data
