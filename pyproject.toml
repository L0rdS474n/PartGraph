[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partgraph"
version = "0.1.0"
description = "Local Dgraph graph database for electronic components: manufacturers, variants, parameters and datasheet links, with future semantic search."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "L0rdS474n" }]
keywords = ["dgraph", "electronics", "components", "graph-database", "datasheet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
# Only two of these carry a bound, and only because there is evidence they can
# change behaviour this repository decides on — the same test the `ruff` pin
# below had to be paid for the hard way. The other five are bare on purpose;
# ADR-0025 records the reason for each, and a test holds them bare so a future
# `pip freeze`-shaped pin cannot land unargued.
dependencies = [
    "typer",
    "rich",
    # Bound because it tracks the Dgraph SERVER's release line, not because a
    # release was observed breaking us — weaker evidence than psutil below, and
    # ADR-0025 says so. 25.0.0 regenerated the protos "to support Dgraph v25
    # API"; 25.1.0 deprecated `DgraphClientStub.from_cloud()`/`.parse_host()`
    # with removal planned for 26.0.0. docker/docker-compose.yml pins the server
    # to `dgraph/standalone:v25.3.4`, so a client resolving a major line ahead
    # of the server is a coupling nothing in this repo would catch. Move the
    # ceiling when the compose file moves to a v26 server, not before.
    "pydgraph>=25.2.0,<26",
    "httpx",
    "pyyaml",
    "requests",
    # The FLOOR is the load-bearing half. `db idle-stop` decides whether a
    # lease's owner is still alive from `(pid, create_time)` — the technique
    # psutil documents, but which WE perform: psutil only checks PID reuse
    # inside its signal/set methods, and nothing in src/ calls one (the stop
    # goes through the container engine). `util/activity.py` reads create_time
    # and compares it itself, so the floor is the only thing standing between a
    # clock step and a wrong answer. psutil's changelog makes
    # `create_time()` monotonic-clock-based in ONE release, 7.1.0: all four
    # issues (#2526, #2541, #2570, #2578) sit inside that single section.
    # 7.1.1 is SunOS-only; 7.1.2/7.1.3 are macOS/BSD zombie-reaping fixes and
    # touch neither Linux nor create_time — so 7.1.0 is the floor, and flooring
    # higher would reject working releases for a reason that does not exist
    # (this bound was first written `>=7.1.3` on exactly that misreading; see
    # ADR-0025). Before 7.1.0, an ordinary NTP correction could shift the value
    # for a still-running process: a false "dead", which `util/activity.py`'s
    # tolerance comment names as the unsafe direction because it lets a stop
    # through while real work is in flight. psutil's FAQ says the same from
    # another angle: it disables its own PID-reuse check on FreeBSD, OpenBSD,
    # SunOS and AIX (NOT NetBSD — that list is from the 7.1.0 changelog and is
    # a different statement) because create_time is not NTP-stable there, and
    # names the symptom as false NoSuchProcess for a live process. On those four
    # our manual comparison is unreliable at ANY version; we target Linux.
    # Lowering this floor does not fail a gate; it silently re-arms a wrong stop
    # decision. The ceiling rests on the 8.0.0 section's own "psutil 8.0
    # introduces breaking API changes" line, and on nothing narrower: it names
    # no create_time change. On Linux, and outside that section's Compatibility
    # notes, it touches none of `create_time`, `is_running` or `NoSuchProcess` —
    # but it DOES carry BSD/Windows `NoSuchProcess` fixes, two of them (#2888,
    # #2895) about wrongly raising it for a process that is still alive after a
    # clock update. Those remove FALSE "dead" answers, which is our safe
    # direction, so they argue for 8.0 rather than against it. An earlier draft
    # of this comment said the section touched none of the three at all. It
    # names `NoSuchProcess` eight times; ADR-0025 § 6 records how that got in.
    "psutil>=7.1.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Pinned exactly. A lint gate whose ruleset moves under it is not a gate:
    # ruff 0.16.0 promoted PLR0917 out of preview and CI began failing on code
    # that had been on main, unchanged and green, for months. Bump this
    # deliberately, with the new findings triaged in the same commit.
    "ruff==0.16.0",
]
# Heavy semantic-search extra (pulls torch). Kept OUT of [dev] so a plain
# `pip install -e ".[dev]"` and CI never download the model stack; only an
# explicit `pip install -e ".[embed]"` enables `partgraph embed` / `--semantic`.
embed = [
    "sentence-transformers>=2.2",
]

[project.urls]
Homepage = "https://github.com/L0rdS474n/PartGraph"
Repository = "https://github.com/L0rdS474n/PartGraph"

# The console script targets a zero-argument callable.  `partgraph.cli:main`
# wraps the module-level `app` Typer object (which the test-suite imports
# directly) so both the entry point and `from partgraph.cli import app` work.
[project.scripts]
partgraph = "partgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a running Dgraph instance (deselect with -m 'not integration')",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PL",   # pylint
    "BLE",  # flake8-blind-except
    "RUF",  # ruff-specific rules
]

# The test suite is the executable contract and uses patterns that are
# idiomatic in tests but noisy under the production ruleset: magic values in
# assertions, intentional module-level / lazy imports, subprocess.run without an
# explicit check, and so on. Relax exactly those rules for tests/ only; the
# src/ tree keeps the full ruleset.
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",  # magic value used in comparison (expected in assertions)
    "PLW1510",  # subprocess.run without explicit check (tests inspect output)
    "PLC0415",  # import not at top level (tests use guarded/lazy imports)
    "B007",     # loop control variable not used within the loop body
    "E501",     # line too long (long assertion messages)
    "F401",     # imported but unused (intentional import-for-collection-error)
    "F841",     # local variable assigned but never used
    "I001",     # import block is un-sorted (test import ordering is documented)
    "RUF005",   # consider iterable unpacking instead of concatenation
    "RUF100",   # unused noqa (test files carry their own documented noqas)
    "SIM102",   # nested if (kept explicit for readability in tests)
]
